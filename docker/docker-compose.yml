# セルフホスト用の開発環境。
#
#   docker compose -f docker/docker-compose.yml up -d
#
# 起動するもの:
#   web      : Next.js（3D 表示 + BFF）
#   api      : スタンドアロン API（Docker 構成ではこちらを使う場合に）
#   postgres : PostgreSQL + PostGIS（道路ネットワーク / POI の永続化）
#   valhalla : ルーティングエンジン（初回は OSM PBF からタイルを構築する）
#
# 注意: valhalla の初回起動は OSM データのビルドで時間がかかる（関東で数十分規模）。
#       PBF は data/osm/ に置くか、下記の環境変数の URL から自動ダウンロードさせる。

name: immersive-japan-map

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # 自前 Valhalla を使う
      ROUTING_ENGINE: valhalla
      VALHALLA_URL: http://valhalla:8002
      # 自前 Overpass / Nominatim があればここで差し替える
      OVERPASS_ENDPOINTS: ${OVERPASS_ENDPOINTS:-https://overpass-api.de/api/interpreter}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-immersive-japan-map/0.1 (selfhosted)}
      DATABASE_URL: postgres://ijm:ijm@postgres:5432/ijm
      # AI（任意）
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
    depends_on:
      - valhalla
      - postgres
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      ROUTING_ENGINE: valhalla
      VALHALLA_URL: http://valhalla:8002
      OVERPASS_ENDPOINTS: ${OVERPASS_ENDPOINTS:-https://overpass-api.de/api/interpreter}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      DATABASE_URL: postgres://ijm:ijm@postgres:5432/ijm
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - valhalla
      - postgres
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ijm
      POSTGRES_PASSWORD: ijm
      POSTGRES_DB: ijm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ijm']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valhalla:
    # ビルド済みイメージ。初回起動時に PBF からタイルを構築する。
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    ports:
      - '8002:8002'
    environment:
      # data/osm に置いた PBF を使う（無い場合は下の URL から取得）
      tile_urls: ${OSM_PBF_URL:-https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf}
      server_threads: 4
      use_tiles_ignore_pbf: 'True'
      build_elevation: 'False'
      build_admins: 'True'
      build_time_zones: 'True'
      force_rebuild: 'False'
    volumes:
      - valhalla_tiles:/custom_files
      - ../data/osm:/data/osm:ro
    restart: unless-stopped

  # 3D Tiles を自前ホストする場合の静的配信（PLATEAU 配信サービスを使わない構成）
  tiles:
    image: nginx:1.27-alpine
    profiles: ['selfhost-tiles']
    ports:
      - '8090:80'
    volumes:
      - ../data/tiles:/usr/share/nginx/html:ro
      - ./nginx/tiles.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  valhalla_tiles:
